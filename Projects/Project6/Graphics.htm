<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent a Pet - Graphics</title>

<style>


	#thumbs, #image {
		width: 700px;
		border: solid 1px #000;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
		background: #eee;
		padding: 5px;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:400px;
	}

	.instructions{
		font-style:italic;
	}

	.center{
		text-align: center;
	}

</style>

<script>

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/Print1.jpg"
	PrintButton2.src = "images/Print2.jpg"
	logo1.src = "images/logo1.jpg"
	logo2.src = "images/logo2.jpg"
}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Dog Performing a Trick',
			'Two Dogs',
			'Dog and Two Boys Portrait',
			'Woman and Dog'
			
		);
			
		var imgPath = "images/fullsize/";

		//Swaps an image's src by id - used by the print button and logo rollovers
		function swapSrc(id, imgObj) {
			document.getElementById(id).src = imgObj.src;
		}
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div class="center">

<div>
	<a href="" onmouseover="swapSrc('PrintButton', PrintButton2);"
	onmouseout="swapSrc('PrintButton', PrintButton1);">

	<img src="images/Print1.jpg" width="200" height="50" 
	id="PrintButton" alt="Print this web page" style="border:none;">

	</a>
</div>


<div id="logo">
	<a href="logo.html" onmouseover="swapSrc('logoImg', logo2);"
	onmouseout="swapSrc('logoImg', logo1);">

	<img src="images/logo1.jpg" width="500" height="160" 
	id="logoImg" alt="Rent a Pet logo" style="border:none;">

	</a>
</div>

<br>
<br>
<br>
<br>


<div id="thumbs">
		<img src="images/thumbnails/image1sm.jpg" alt="Dog doing Trick" onmouseover="swapImage(0);">
		<img src="images/thumbnails/image2sm.jpg" alt="Two hunting Dogs" onmouseover="swapImage(1);">
		<img src="images/thumbnails/image3sm.jpg" alt="Dog and two kids" onmouseover="swapImage(2);">
		<img src="images/thumbnails/image4sm.jpg" alt="Woman and Dog" onmouseover="swapImage(3);">
		
</div>

	<div id="image">

		<img id="theImage" src="Images/fullsize/Image1Lg.jpg" alt="Dog doing trick">
		<h1 id="bottomText">Dog doing trick</h1>
	</div>

<img src="images/2colback.jpg" alt="colored background placeholder image">

<br>
<br>
<br>
<br>



</div>

<p>
    <a href="https://validator.w3.org/nu/?doc=https://rachael-hull.github.io/INFO2420/Project6/Graphics.htm"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88"></a>
</p>
  

</body>
</html>
